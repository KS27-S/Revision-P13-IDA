<!doctype html>
<!-- Page projet : présentation de la section projets pratiques -->
<html lang="fr">
  <!-- En-tête : métadonnées, titre de l'onglet et feuille de style commune -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projet | Révision P13 IDA</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- En-tête commun : script.js remplit ce conteneur avec le logo et le menu -->
    <header id="site-header"></header>
    <!-- Contenu principal : présentation de la section projet -->
    <main>
      <h1>Projet</h1>
      <p>Bienvenue dans la section du projet !</p>
    </main>
    <!-- Pied de page commun : script.js remplit ce conteneur -->
    <footer id="site-footer"></footer>
    <!-- Script commun chargé après l'analyse du document (attribut defer) -->
    <script src="script.js" defer></script>
  </body>
</html>
