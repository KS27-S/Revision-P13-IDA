<!doctype html>
<!-- Page d'accueil : message de bienvenue et accès à la révision -->
<html lang="fr">
  <!-- En-tête : métadonnées, titre de l'onglet et feuille de style commune -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accueil | Révision P13 IDA</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- En-tête commun : script.js remplit ce conteneur avec le logo et le menu -->
    <header id="site-header"></header>

    <!-- Contenu principal : section de bienvenue avec titre animé -->
    <main class="welcome-page">
      <!-- Section de bienvenue : chaque mot est animé par la feuille de style -->
      <section
        class="welcome"
        aria-label="Bienvenue sur le site de révision P13 IDA"
      >
        <p class="welcome-kicker">Plateforme de révision · Promotion IDA P13</p>
        <h1 class="welcome-title">
          <span class="welcome-word">Bienvenue</span>
          <span class="welcome-word">sur</span>
          <span class="welcome-word">le</span>
          <span class="welcome-word">site</span>
          <span class="welcome-word">de</span>
          <span class="welcome-word">révision</span>
          <span class="welcome-word">P13</span>
          <span class="welcome-word">IDA&nbsp;!</span
          ><span class="welcome-cursor" aria-hidden="true"></span>
        </h1>
        <p class="welcome-subtitle">
          Quiz, TD, rappels de cours, assistant de révision et espace étudiant :
          tout votre parcours de révision au même endroit.
        </p>
        <div class="welcome-divider" aria-hidden="true"></div>
        <!-- Lien principal vers la page de révision -->
        <a class="welcome-link" href="revision.html"
          >Commencer à réviser <span aria-hidden="true">→</span></a
        >
      </section>
    </main>

    <!-- Pied de page commun : script.js remplit ce conteneur -->
    <footer id="site-footer"></footer>
    <!-- Script commun chargé après l'analyse du document (attribut defer) -->
    <script src="script.js" defer></script>
  </body>
</html>
